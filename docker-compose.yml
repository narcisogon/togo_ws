services:

  # ─────────────────────────────────────────────
  # Base: shared infrastructure only
  # Display, GPU, DDS middleware, shell history
  # ─────────────────────────────────────────────
  _base:
    env_file: .env
    image: togo_docker_ws-narciso
    build:
      context: .
      dockerfile: Dockerfile
      target: er4-robot
      args:
        - USERNAME=er4-user
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
        - ROS_WS_BASE_IMAGE_TAG=${ROS_WS_BASE_IMAGE_TAG:-jazzy-devel}
    init: true
    stdin_open: true
    tty: true
    privileged: true
    # Share the WSL host network so ROS 2 DDS can connect native Gazebo to
    # SLAM nodes running in this container.
    network_mode: host
    ipc: host
    pid: host
    runtime: nvidia
    devices:
      # WSL virtual GPU device used by Mesa's D3D12 renderer.
      - /dev/dxg:/dev/dxg
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROS_DOMAIN_ID=29
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=/cyclonedds.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds.xml
      - HISTFILE=/home/er4-user/.bash/.bash_history
      - RCUTILS_COLORIZED_OUTPUT=1
      - NVIDIA_VISIBLE_DEVICES=all
      # Keep CUDA/nvidia-smi support, but let WSLg Mesa/D3D12 own OpenGL.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # WSL display integration (separate from Docker/NVIDIA GPU settings above)
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/${USER_UID:-1000}
      - QT_QPA_PLATFORM=xcb
      # WSL GPU graphics libraries (separate from WSL display sockets above)
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
    volumes:
      # DDS middleware configs
      - ${CYCLONEDDS_URI:-./config/cyclonedds.xml}:/cyclonedds.xml:ro
      - ${FASTRTPS_DEFAULT_PROFILES_FILE:-./config/fastdds.xml}:/fastdds.xml:ro
      # Shell history
      - ./.bash:/home/er4-user/.bash
      # WSLg display sockets and runtime directory
      - /mnt/wslg:/mnt/wslg:ro
      - /run/user/${USER_UID:-1000}:/run/user/${USER_UID:-1000}:ro
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix:ro
      # WSL GPU graphics libraries
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - $HOME/.Xauthority:/home/er4-user/.Xauthority:ro


  # ─────────────────────────────────────────────
  # micro-ROS agent — standalone, no base needed
  # ─────────────────────────────────────────────
  micro-ros:
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    image: microros/micro-ros-agent:jazzy
    command: ["udp4", "-p", "11411"]
    healthcheck:
      test: ["CMD", "pidof", "-q", "micro_ros_agent"]
      interval: 1s
      timeout: 5s
      retries: 3


  # ─────────────────────────────────────────────
  # hw-dev: hardware development
  # Extends base + mounts both workspaces + /dev
  # ─────────────────────────────────────────────
  hw-dev:
    extends: _base
    ulimits:
      rtprio: 99
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Sim workspace
      - ./src:/home/er4-user/ws/src/:rw
      - ./install:/home/er4-user/ws/install/:rw
      - ./build:/home/er4-user/ws/build/:rw
      - ./log:/home/er4-user/ws/log/:rw
      - ./.ccache:/home/er4-user/.ccache
      # SLAM workspace
      - ./lidarslam_ros2:/home/er4-user/slam_ws/src/lidarslam_ros2:rw
      - ./slam_output:/home/er4-user/slam_ws/src/lidarslam_ros2/output:rw
      # Shared data
      - ./bags:/bags:rw
      - ./scripts:/scripts:ro
      # Hardware access
      - /dev:/dev
    command: sleep infinity
    depends_on:
      micro-ros:
        condition: service_healthy
    profiles:
      - hw-dev


  # ─────────────────────────────────────────────
  # dev: simulation development
  # Extends base + mounts both workspaces
  # ─────────────────────────────────────────────
  dev:
    extends: _base
    build:
      target: er4-dev
    volumes:
      # Sim workspace
      - ./src:/home/er4-user/ws/src/:rw
      - ./install:/home/er4-user/ws/install/:rw
      - ./build:/home/er4-user/ws/build/:rw
      - ./log:/home/er4-user/ws/log/:rw
      - ./.ccache:/home/er4-user/.ccache
      # SLAM workspace
      - ./lidarslam_ros2:/home/er4-user/slam_ws/src/lidarslam_ros2:rw
      - ./slam_output:/home/er4-user/slam_ws/src/lidarslam_ros2/output:rw
      # Shared data
      - ./bags:/bags:rw
      - ./scripts:/scripts:ro
    command: sleep infinity
    profiles:
      - dev
