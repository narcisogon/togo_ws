/**:
  controller_manager:
    ros__parameters:
      update_rate: 50
      use_sim_time: True

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      platform_velocity_controller:
        type: diff_drive_controller/DiffDriveController

  platform_velocity_controller:
    ros__parameters:
      update_rate: 50
      use_sim_time: True
      publish_rate: 50.0
      open_loop: False
      tf_frame_prefix_enable: True

      command_joint_names: [front_left_wheel_joint, rear_left_wheel_joint, front_right_wheel_joint, rear_right_wheel_joint]
      left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
      right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]

      wheel_separation: 0.562
      wheels_per_side: 2
      wheel_radius: 0.1625
      wheel_separation_multiplier: 1.75
      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      cmd_vel_timeout: 0.5
      velocity_rolling_window_size: 5
      preserve_turning_radius: True
      publish_limited_velocity: True
      publish_wheel_data: True

      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

      base_frame_id: base_link
      odom_frame_id: odom
      enable_odom_tf: False
      position_feedback: False

      linear.x:
        has_velocity_limits: True
        has_acceleration_limits: True
        has_jerk_limits: False
        max_velocity: 0.8
        min_velocity: -0.8
        max_acceleration: 2.0
        max_deceleration: -4.0
        max_acceleration_reverse: -2.0
        max_deceleration_reverse: 4.0
        max_jerk: 0.0
        min_jerk: 0.0

      angular.z:
        has_velocity_limits: True
        has_acceleration_limits: True
        has_jerk_limits: False
        max_velocity: 2.0
        min_velocity: -2.0
        max_acceleration: 4.0
        max_deceleration: -4.0
        max_acceleration_reverse: -4.0
        max_deceleration_reverse: 4.0
        max_jerk: 0.0
        min_jerk: 0.0
