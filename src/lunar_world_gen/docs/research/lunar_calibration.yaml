# Lunar surface calibration parameters, Apollo 16 LM site (Cayley plains) and rocky variant.
# Companion to lunar_calibration.md (same folder); section numbers refer to that report.
# Produced by the science agent, 2026-10-25.
#
# Conventions:
#   value       recommended value
#   range       plausible range [low, high]
#   units       SI unless stated; D = rock or crater diameter in metres
#   source      keys into the `sources` section at the bottom
#   confidence  H / M / L
#   basis       read      = number read in the source
#               snippet   = number from a secondary summary or abstract
#               recalled  = standard value from memory, not re-read
#               measured  = computed here from the DTM or a model
#               derived   = synthesis or extrapolation
#   valid_for   size or scale range where the value applies; outside it the value is an extrapolation

