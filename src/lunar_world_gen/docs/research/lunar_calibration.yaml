craters:
  sfd_model: "cumulative N(>=D) = C * D^-b per m^2, D in m; equilibrium (steady state)"
  C_per_m2: {value: 0.05, range: [0.03, 0.08], units: "m^-2 (with D in m)", valid_for: "0.2-50 m (equilibrium extends to >~100-300 m on ~3.9 Ga Cayley plains)", source: [shoemaker1970, sp8023, xiao_werner2015, hirabayashi2017, minton2019], confidence: M, basis: derived, note: "classical steady state 0.079 (=10^-1.1, 5.2 % of geometric saturation) is the upper end; Xiao & Werner 0.011-0.060; Apollo 15 site ~0.016*D^-1.8; no Apollo 16 count at 0.2-50 m found. Below 1 m only Surveyor data (L)."}
  b_cumulative_slope: {value: 2.0, range: [1.8, 2.0], source: [shoemaker1970, xiao_werner2015, hirabayashi2017], confidence: H, basis: read}
  geometric_saturation_coefficient: {value: 1.54, units: "N = 1.54 D^-2", source: [minton2019], confidence: H, basis: recalled}
  reference_counts_per_100x100m:
    D_ge_m: [0.2, 0.5, 1, 2, 5, 10, 20, 50]
    C_0p05: [12500, 2000, 500, 125, 20, 5, 1.25, 0.2]
    C_0p079: [19858, 3177, 794, 199, 32, 7.9, 2.0, 0.32]
    C_0p03: [7500, 1200, 300, 75, 12, 3, 0.75, 0.12]
    basis: measured
  degradation_fractions:
    fresh_A: {value: 0.05, range: [0.03, 0.10], source: [mahanti2018], confidence: M, basis: "read (35-250 m: A 'a little <3 %', C '>70 %'); extrapolated below 35 m (L)"}
    intermediate_B: {value: 0.25, range: [0.20, 0.30], source: [mahanti2018], confidence: M, basis: read}
    degraded_C: {value: 0.70, range: [0.60, 0.75], source: [mahanti2018], confidence: M, basis: read}
    generator_rule: "relative freshness rho = d/d_fresh = exp(-u), u ~ U(0,3)  ->  ~10 % rho>0.73, ~20 % 0.4-0.73, ~70 % <0.4"
  mean_d_over_D_population: {value: 0.07, range: [0.05, 0.10], valid_for: "35-250 m", source: [mahanti2018], confidence: M, basis: "read (<0.1)"}
  d_over_D_fresh_by_size:
    D_gt_400m: {value: 0.20, source: [stopar2017], confidence: H, basis: read}
    D_200_400m: {value: 0.17, source: [stopar2017], confidence: H, basis: read}
    D_100_200m: {value: 0.15, source: [stopar2017], confidence: H, basis: read}
    D_30_100m: {value: 0.12, range: [0.11, 0.14], source: [stopar2017], confidence: H, basis: read}
    D_lt_30m: {value: 0.13, range: [0.10, 0.17], source: [stopar2017, basilevsky2012_lunokhod], confidence: L, basis: derived, note: "below NAC DTM resolution; extrapolation"}
  d_over_D_by_state:
    fresh_A: {value: 0.13, range: [0.11, 0.17], confidence: M}
    intermediate_B: {value: 0.08, range: [0.06, 0.10], confidence: M}
    degraded_C: {value: 0.03, range: [0.01, 0.06], confidence: M}
    source: [stopar2017, mahanti2018, sp8023]
    basis: derived
    pre_apollo_reference_sp8023: {fresh: [0.23, 0.25], young: [0.17, 0.19], mature: [0.11, 0.13], note: "superseded by LROC for D<400 m"}
  rim_height_over_D:
    fresh_A: {value: 0.03, range: [0.022, 0.04], source: [sp8023, ulrich1981g, this_work_dtm], confidence: M, basis: "read (SP-8023 fresh 0.022-0.06; South Ray 0.030-0.034)"}
    intermediate_B: {value: 0.015, range: [0.01, 0.025], source: [sp8023], confidence: M, basis: read}
    degraded_C: {value: 0.005, range: [0.0, 0.01], source: [sp8023], confidence: M, basis: read}
  interior_profile:
    fresh_A: "paraboloid bowl; max wall slope atan(4 d/D) = 26-31 deg for d/D 0.12-0.15 (below regolith repose ~35 deg)"
    intermediate_B: "flattened bowl / cone, wall 12-25 deg"
    degraded_C: "inverted cone, wall 2-12 deg (Mahanti 2018)"
    flat_floor_threshold: {value: "D/t > 4 (t = regolith thickness ~7 m -> D > ~28 m, fresh craters)", source: [quaide_oberbeck1968], confidence: M, basis: snippet}
    concentric_bench_threshold: {value: "D/t > 8-10 (-> D > ~60 m)", source: [quaide_oberbeck1968], confidence: M, basis: snippet}
  ejecta:
    thickness_profile: {value: "t(r) = t_rim * (r/R)^-3 for r >= R", source: [mcgetchin1973, ulrich1981g], confidence: M, basis: "snippet / read (South Ray preferred exponent -3.0)"}
    ejecta_fraction_of_rim_height: {value: 0.6, range: [0.5, 0.7], source: [ulrich1981g], confidence: M, basis: read, note: "South Ray: 10-12 m ejecta on 20-22 m rim"}
    continuous_extent_R_from_center: {value: 2.5, range: [2, 3], units: "crater radii", source: [mcgetchin1973], confidence: M, basis: snippet}
    rays_extent_D: {value: 15, range: [10, 16], units: "crater diameters (South Ray rays ~10 km)", source: [holt1981, ulrich1981g], confidence: M, basis: read}
  blocky:
    rule: "fresh (A) or intermediate (B) craters with D > ~4-6 * regolith thickness are blocky; P(blocky) ramps 0 at D=20 m -> 1 at D>=80 m (t~7 m); degraded (C) craters carry no extra blocks"
    min_blocky_D_m: {value: 30, range: [20, 40], source: [freeman1981, ulrich1981g, schaber1981], confidence: M, basis: derived, note: "WC (40 m) reached bedrock; Buster (90 m) blocky; Spook (370 m, old) not blocky"}
    block_annulus_R: {value: [1.0, 2.0], source: [sp8023], confidence: M, basis: read}
    block_sfd_in_annulus_nominal: {value: "N(>=D) = 1e-2 * (D/0.7)^-2.8 per m^2", valid_for: "0.5-20 m", source: [sp8023], confidence: M, basis: "read (digitised)"}
    largest_block_m: {value: "B_max = 0.29 * D^0.66 (D in m)", range: "coefficient 0.25-0.3", source: [bart_melosh2010], confidence: L, basis: "recalled, not verified; consistent with North Ray (1 km -> ~25 m) and Buster (90 m -> 5 m)"}
    boulder_survival: {value: "~50 % of metre-size boulders destroyed in several tens of Myr; 90-99 % in 200-300 Myr", source: [basilevsky2015, ghent2014], confidence: M, basis: snippet}
  dtm_consistency_check:
    basis: measured
    source: [this_work_synthetic]
    result: "crater-only terrain (C=0.079, fresh d/D 0.18) through a NAC-DTM emulator gives detrended directional RMS slope 3.1 deg (2 m) / 2.6 deg (10 m) vs DTM 2.9 / 2.5 deg, but the slope distribution is too bimodal (gradient median 0.8 vs 2.4 deg)"
    guidance: "use the DTM for wavelengths > ~6-10 m; add synthetic craters only for 0.2-10/20 m (C~0.05) plus fractal roughness; tune the composite to the roughness targets"

rocks:
  definition: "N(>=D) = cumulative number of rocks per m^2 with longest visible diameter >= D (m); cover fractions use projected discs pi D^2/4"
  model_form: "broken power law N(>=D) = A_i * D^-b_i per segment, continuous at breaks"
  sizes_cm_for_tables: [2, 5, 10, 20, 50, 100, 200]
  lm_site:
    description: "Apollo 16 LM/ALSEP area: Cayley plains with discontinuous South Ray ray debris"
    segments:   # [D_lo_m, D_hi_m, b]
      - [0.005, 1.0, 2.8]
      - [1.0, 50.0, 3.5]
    A_N_ge_1m_per_m2: {value: 3.78e-4, range: [1.4e-4, 1.5e-3], source: [schaber1981, this_work_rocks], confidence: M, basis: "derived (fit to 2-20 cm cover = 2.0 %)"}
    b1: {value: 2.8, range: [2.6, 3.1], valid_for: "0.02-1 m", source: [schaber1981, this_work_rocks], confidence: M, basis: "derived from cover ratios (LM: F(>10 cm)/F(2-20 cm); station 2: >5 cm/all; station 1: >10 cm/>2 cm imply 2.8-3.1)"}
    b2: {value: 3.5, range: [3.0, 4.0], valid_for: "1-10 m", source: [cintala_mcbride1994], confidence: L, basis: "derived (large blocks steeper than surface power laws)"}
    D_max_in_100m_tile_m: {value: 3, range: [2, 5], confidence: L, basis: derived, note: "largest boulder near ALSEP 'several metres'"}
    counts_per_100m2:   # D >= 2, 5, 10, 20, 50, 100, 200 cm
