# Apollo 16 LROC NAC DTM analysis and site selection for the TOGO lunar world.
# Produced by the "site" research task (2026-10-25). Method, evidence and figures: site_selection.md.
# Scratch scripts / previews: /home/nargon/togo_assets/lunar/experiments/site/ (s01..s21 *.py, p01..p17 *.png).
#
# Conventions
#   lat/lon: planetocentric degrees, Mean Earth / Polar Axis (ME) frame, east-positive longitude.
#   h: metres above the reference sphere R = 1737400 m (the DTM's height reference).
#   proj x/y: DTM map coordinates (Equidistant Cylindrical, see `projection`).
#   pixel col/row: GDAL corner convention (pixel (c, r) spans [c, c+1) x [r, r+1); its centre is
#     (c + 0.5, r + 0.5); integer array index = floor). Row 0 is the NORTH edge of the DTM.
#   Local frame: ENU tangent plane at the core centre: x = east, y = north, z = up,
#     z = (R + h) * R / sqrt(R^2 + d^2) - (R + href)  (gnomonic mapping, Moon curvature included).
#   tools/dtm_extract.py reads `core` / `rocky_alternative` (centre.lat_deg/lon_deg, href_m, yaw_deg, size_m).
version: 1

dtm:
  product_id: NAC_DTM_APOLLO16
  product_version: v1.9            # PDS label PRODUCT_VERSION_ID, created 2020-10-13
  file: src/togo/togo_gz/media/dem/NAC_DTM_APOLLO16.TIF
  filled_file: src/togo/togo_gz/media/dem/NAC_DTM_APOLLO16_filled.tif
  size_px: [11985, 15653]          # cols (E-W), rows (N-S)
  posting_m: 2.0
  dtype: float32
  nodata: -3.4028226550889045e+38
  height_reference: "sphere R = 1737400 m"
  source: "6 LROC NAC stereo pairs (12 images, 2010-02-02 .. 2011-07-19), ISIS 3 + SOCET SET 5.5 (NGATE), 6 sub-DTMs mosaicked"
  producer_accuracy:
    relative_linear_error_90pct_m: 0.88   # LROC RDR page 'Relative LE' (SOCET SET, 90 % confidence)
    lola_rms_m: 1.02                      # RMS vs LOLA tracks
  nodata_fraction: {full_file: 0.0921, filled_file: 0.0693, within_5km_of_LM: 0.0, within_8km_of_LM: 0.0001, within_10km_of_LM: 0.0113}
  filled_vs_original: "bit-identical on all valid pixels; the _filled file only fills 4.27 M interior pixels (2.3 % of the grid); none within 8 km of the LM"
  other_files:
    NAC_DTM_APOLLO16_2049.tif: "UInt16 Gazebo heightmap of a 4098 m window centred on the DTM centre (not the LM): h = 0.014331*DN - 168.284 m (1.43 cm quantum -> terraces); do not use"
    NAC_DTM_APOLLO16_slipmap.tif: "NOT a slip map: 8-bit scaled height of the same 4098 m window (corr 1.000 with h, ~3.7 m per DN); do not use"
    slipmap-2048.tif: "RGB binary rock/obstacle mask (blue discs), 80 x 80 m at 3.9 cm/px, stereographic projection centred on the LROC LM position; not used"

projection:
  crs_proj4: "+proj=eqc +lat_ts=-9 +lat_0=0 +lon_0=180 +x_0=0 +y_0=0 +R=1737400 +units=m +no_defs"
  name: "Equidistant Cylindrical (Equirectangular), spherical"
  sphere_radius_m: 1737400.0
  standard_parallel_deg: -9.0      # lat_ts
  central_meridian_deg: 180.0      # lon_0
  false_easting_m: 0.0
  false_northing_m: 0.0
  K_m_per_rad: 1716009.7229499924  # R * cos(lat_ts)
  geotransform: {X0: -4937550.000001500360668, DX: 2.000000000000600, Y0: -261204.000000080006430, DY: -2.000000000000600}
  pds_label: {MAP_SCALE_m: 2.0000000000006, MAP_RESOLUTION_pix_per_deg: 15161.67521207, SAMPLE_PROJECTION_OFFSET: 2468774.5, LINE_PROJECTION_OFFSET: -130602.5}
  formulas:
    ll_to_xy: "x = K * radians(wrap180(lon - 180)); y = R * radians(lat)"
    xy_to_ll: "lon = wrap180(degrees(x / K) + 180); lat = degrees(y / R)"
    xy_to_px: "col = (x - X0) / DX; row = (y - Y0) / DY"
    px_to_xy: "x = X0 + col * DX; y = Y0 + row * DY"
    pds_sample_line: "sample(1-based centre) = x / MAP_SCALE + SAMPLE_PROJECTION_OFFSET + 1 = col + 0.5; line = LINE_PROJECTION_OFFSET + 1 - y / MAP_SCALE = row + 0.5"
  extent: {lat_deg: [-9.6463615, -8.6139558], lon_deg: [15.1403420, 15.9406753]}
  scale_factors_at_core: {east_west_true_over_projected: 1.0000734, north_south: 1.0, grid_convergence_deg: 0.0}
  verification: "closed form == pyproj to 0.0 m; corners == gdalinfo; DTM h at the LROC LM = 7.79 m vs LROC table 8 +- 3 m (dtm_extract.py --selftest)"

landing_site:
