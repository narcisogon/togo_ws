    proj_x_m: -4926769.010
    proj_y_m: -267529.002
    pixel_col: 5390.4951
    pixel_row: 3162.5012
  offset_from_LM_m: {east: -23.7, north: 4574.6, distance: 4574.6}
  offset_from_north_ray_centre_m: {east: 480, north: -320, radius: 577}
  yaw_deg: 0.0
  size_m: [100, 100]
  href_m: 80.4583                 # area mean of the band-limited DTM over the 100 m square (same definition as core)
  metrics:
    slope_2m_deg: {mean: 10.9, max: 35.4, frac_gt15: 0.21, frac_gt20: 0.084, frac_gt25: 0.028}
    slope_10m_frac_gt15: 0.11
    relief_m: 20.2
    lidar_context: {upward_ray_returns_frac: 0.086, skyline_coverage_frac: 0.47}
    dtm_nodata: 0.0
  house_rock_candidate: {lat_deg: -8.824915, lon_deg: 15.499707, dtm_positive_anomaly_m: 8.6, from_north_ray_centre_m: [462, -392], note: "largest positive 2-12 m anomaly on the SE rim; consistent with House Rock (~15-20 m boulder) but not confirmed"}
  note: "own far field needed (4.6 km from the core); check seams there before use; South Ray ejecta (centre -9.148890, 15.381844) is the other rocky option"

candidates:                       # 100 x 100 m cores within 1 km of the LM; e/n = projected metres from the LROC LM
  selection: "hard: seam >= 200 m, 2 m slope > 15 deg <= 5 %, > 20 deg <= 1 %, 10 m slope > 15 deg <= 2 %, max 2 m slope <= 30; score: LiDAR upward returns x2 + skyline + crater 15-50 m + undulation - steepness - distance"
  table:
    - {id: F1, e: 300.3, n: -1.4, chosen: true, s2_mean: 6.14, s2_gt15: 0.013, s2_max: 26.8, s10_max: 14.0, relief: 10.2, craters: [181, 33.9, 22.6, 14.1], lidar_up: 0.101, skyline: 0.927}
    - {id: F2, e: -59.7, n: 258.6, s2_mean: 5.18, s2_gt15: 0.004, s2_max: 19.0, s10_max: 13.6, relief: 8.6, craters: [113, 28.3, 17.0, 8.5], lidar_up: 0.061, skyline: 0.841}
    - {id: F3, e: 60.3, n: -41.4, s2_mean: 4.34, s2_gt15: 0.007, s2_max: 23.3, s10_max: 13.9, relief: 6.2, craters: [181, 28.3, 17.0], lidar_up: 0.060, skyline: 0.836}
    - {id: F4, e: 0.3, n: -361.4, s2_mean: 5.30, s2_gt15: 0.012, s2_max: 21.9, s10_max: 16.2, relief: 6.9, craters: [147, 22.6, 17.0], lidar_up: 0.074, skyline: 0.809}
    - {id: F5, e: -279.7, n: -801.4, s2_mean: 4.37, s2_gt15: 0.0, s2_max: 12.9, s10_max: 9.6, relief: 4.8, craters: [17.0, 17.0, 11.3, 8.5], lidar_up: 0.064, skyline: 0.966}
    - {id: LM, e: 0.0, n: 0.0, s2_mean: 4.20, s2_gt15: 0.008, s2_max: 23.3, s10_max: 13.9, relief: 7.1, craters: [181, 17.0], lidar_up: 0.059, skyline: 0.799}
