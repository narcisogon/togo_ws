%YAML:1.0
# The stereo rig's cameras in the VIO's IMU frame, imu_0 at (0.059, 0, 0.161275) in base_link, base-aligned;
# the rig's optical centres sit at (0.45, +-0.10, 0.50), so p_CinI = (0.391, +-0.10, 0.3387). Earlier text:
# the stereo rig's cameras in its own IMU frame (togo_description/urdf/stereo_vio_rig.urdf.xacro, printed by
# tools/urdf_frame_offset.py on the assembled model) - both optical frames look along the rig's +x, left at
# +0.10 m, right at -0.10 m (baseline 0.20 m). T_imu_cam = [R_CtoI | p_CinI]. Pinhole, no distortion;
# 640x480 with a 90 deg horizontal field of view - f = 320 / tan(45 deg) = 320 px. The principal point is
# the one the simulation's CameraInfo reports (checked with record_bag.sh --check-sensors).

cam0:
  T_imu_cam:
    - [0.0,  0.0, 1.0,  0.391]
    - [-1.0, 0.0, 0.0,  0.10]
    - [0.0, -1.0, 0.0,  0.3387]
    - [0.0,  0.0, 0.0,  1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [320.0, 320.0, 320.0, 240.0] #fu, fv, cu, cv
  resolution: [640, 480]
  rostopic: /husky/sensors/stereo_rig/left/image_raw
cam1:
  T_imu_cam:
    - [0.0,  0.0, 1.0,  0.391]
    - [-1.0, 0.0, 0.0, -0.10]
    - [0.0, -1.0, 0.0,  0.3387]
    - [0.0,  0.0, 0.0,  1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  distortion_model: radtan
  intrinsics: [320.0, 320.0, 320.0, 240.0] #fu, fv, cu, cv
  resolution: [640, 480]
  rostopic: /husky/sensors/stereo_rig/right/image_raw
