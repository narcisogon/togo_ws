%YAML:1.0 # OpenVINS (ov_msckf) estimator settings for the simulated stereo rig on the Apollo 16 world.
# imu_0 variant (the rover IMU, ideal, 100 Hz) of estimator_config.yaml. Derived from open_vins/config/euroc_mav/estimator_config.yaml (2026-10-31); only the lines that differ from the
# EuRoC defaults carry a comment. Companion files - kalibr_imu_chain.yaml, kalibr_imucam_chain.yaml.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

calib_cam_extrinsics: false      # the rig's geometry is known exactly in the simulation (urdf_frame_offset.py)
calib_cam_intrinsics: false      # ... and so are the pinhole intrinsics (no distortion)
calib_cam_timeoffset: false      # rendered in the same step as the IMU sample stream - no offset
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 1.62                # lunar gravity (the world's physics.gravity_m_s2; Earth would be 9.81)

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update - the rover stands still at the start of every bag and at the end
try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# initialization - static (the 15 s standstill at the start), then the drive-off "jerk" starts the filter.
# init_imu_thresh is the accelerometer variance that counts as motion; the rover's gentle start on 1.62 m/s^2
# needs a lower threshold than EuRoC's 1.5
init_window_time: 2.0
init_imu_thresh: 0.25
init_max_disparity: 10.0
init_max_features: 50
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# feature tracking
use_klt: true
num_pts: 200
fast_threshold: 15               # regolith is low-contrast - a little more permissive than EuRoC's 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 20.0            # the rig's frame rate
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE"        # as in estimator_config.yaml (global HISTOGRAM equalisation made OpenVINS diverge on the regolith noise)

use_mask: false                  # no static mask (the rover's body is out of the rig's view)
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# measurement noise (pixels) and chi2 inflation
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

# the two companion files, relative to this one (ov_msckf resolves them through relative_config_imu / cam)
relative_config_imu: "kalibr_imu_chain_imu0.yaml"
relative_config_imucam: "kalibr_imucam_chain_imu0.yaml"
