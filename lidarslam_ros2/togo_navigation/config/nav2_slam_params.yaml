bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /dlio/odometry
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 5000

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /dlio/odometry
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.20  # Turning in place also counts as progress (radians).
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.75
      lookahead_dist: 0.8
      min_lookahead_dist: 0.35
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.9
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false  # No Nav2 exponential inflation model.
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 4.0  # Allows turns to start from rest; velocity_smoother still limits output acceleration.
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05  # StaticLayer adopts the backend map's actual geometry.
      track_unknown_space: true
      transform_tolerance: 0.7
      # Backend costs already describe ROBOT CENTER clearance for the physical
      # footprint. Point geometry avoids applying that footprint a second time.
      robot_radius: 0.0
      footprint_padding: 0.0
      lethal_cost_threshold: 100
      trinary_costmap: false
      unknown_cost_value: 255
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false  # Backend publishes complete snapshots.
        footprint_clearing_enabled: false
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05  # StaticLayer adopts the backend map's actual geometry.
      track_unknown_space: true
      transform_tolerance: 0.7
      # Backend costs already describe ROBOT CENTER clearance for the physical
      # footprint. Point geometry avoids applying that footprint a second time.
      robot_radius: 0.0
      footprint_padding: 0.0
      lethal_cost_threshold: 100
      trinary_costmap: false
      unknown_cost_value: 255
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false  # Backend publishes complete snapshots.
        footprint_clearing_enabled: false
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 500000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 5.0  # Prefer clearance through the backend gradient.
      cache_obstacle_heuristic: false  # Recompute against changing backend snapshots.
      debug_visualizations: false
      use_final_approach_orientation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: /dlio/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother


goal_safety_relay:
  ros__parameters:
    use_sim_time: true
    goal_topic: /goal_pose_requested
    map_topic: /map
    action_name: navigate_to_pose
    allow_unknown_goals: true  # Matches planner allow_unknown; preserved sim policy.
    ready_timeout_sec: 1.0     # Wall-time watchdog for /hazard/ready heartbeats.
    command_timeout_sec: 0.5
    goal_wait_timeout_sec: 5.0 # Keep the latest waypoint through a brief readiness interruption.
